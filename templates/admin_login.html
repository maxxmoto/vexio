<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vexio Admin — Вход</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.8/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.8/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.8/600.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#f6f7f9;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;border-radius:16px;padding:48px 40px;width:100%;max-width:400px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.08)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:#2563eb;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
.brand-text{font-weight:600;font-size:17px;color:#182236}
h1{font-size:24px;font-weight:700;color:#182236;margin:24px 0 8px}
p{font-size:14px;color:#68738a;margin-bottom:24px;line-height:1.5}
.error{background:#fef2f2;color:#dc2626;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;font-weight:500}
input{width:100%;padding:14px 16px;border:1.5px solid #e6e8ee;border-radius:10px;font-size:15px;font-family:inherit;color:#182236;outline:none;transition:border-color .2s}
input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
input::placeholder{color:#98a1b3}
button{width:100%;padding:14px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:16px;transition:background .2s}
button:hover{background:#1d4ed8}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-mark">VX</div>
    <div class="brand-text">Vexio Admin</div>
  </div>
  <h1>Вход в админ-панель</h1>
  <p>Введите пароль для доступа к заявкам и аналитике.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST">
    <input type="password" name="password" placeholder="Пароль" autofocus>
    <button type="submit">Войти</button>
  </form>
</div>
</body>
</html>
