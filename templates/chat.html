<script>
const chatBox=document.getElementById('chatBox'),chatInput=document.getElementById('chatInput'),sendBtn=document.getElementById('sendBtn');

function addMsg(text,cls){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\\n/g,'<br>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^### (.+)/gm,'<h4>$1</h4>').replace(/^## (.+)/gm,'<h3>$1</h3>').replace(/^- (.+)/gm,'&bull; $1').replace(/\*([^*\n]+)\*/g,'<em>$1</em>');chatBox.appendChild(d);chatBox.scrollTop=chatBox.scrollHeight}

function wrapMath(t){var lines=t.split('\n'),out=[],inMath=false;for(var i=0;i<lines.length;i++){var l=lines[i].trim();if(!l){out.push('');continue}var hasMath=/\\frac|\\sqrt|\\cdot|\\int|\\sum|\\boxed|\\implies|\\pm|\\alpha|\\beta|\\gamma|\\delta|\\\\/.test(l);if(hasMath&&!inMath){out.push('$$'+l);inMath=true}else if(!hasMath&&inMath){out.push(l+'$$');inMath=false}else{out.push(l)}}if(inMath)out[out.length-1]+='$$';return out.join('\n')}

async function send(){const msg=chatInput.value.trim();if(!msg)return;addMsg(msg,'user');chatInput.value='';sendBtn.disabled=true;const t=document.createElement('div');t.className='msg typing';t.textContent='Печатает...';chatBox.appendChild(t);chatBox.scrollTop=chatBox.scrollHeight
try{const r=await fetch('/chat-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});const d=await r.json();t.remove();if(d.error)addMsg('Ошибка: '+d.error,'bot');else{var wrapped=wrapMath(d.reply);addMsg(wrapped,'bot');if(typeof MathJax!=='undefined')MathJax.typeset()}}catch(e){t.remove();addMsg('Ошибка соединения','bot')}
sendBtn.disabled=false}
</script>

        

<script>

            if (!nl || !hb) return;
            nl.classList.toggle('mobile');
            hb.classList.toggle('open');
        }
