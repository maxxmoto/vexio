<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vexio News — IT новости сегодня | Технологии, Стартапы, AI, Разработка</title>
<meta name="description" content="IT-новости от Vexio News. Актуальные статьи о технологиях, стартапах, искусственном интеллекте, разработке и криптовалютах. Читайте главное из мира IT прямо сейчас. Обновляется ежедневно.">
<meta name="keywords" content="it новости, технологии новости, стартапы новости, ai новости, новости разработки, vexio news, хайтек новости, tech news, hn, hacker news, новости it сегодня">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="canonical" href="https://vexiostudio.ru/news/">
<meta property="og:title" content="Vexio News — IT новости сегодня | Технологии, AI, Стартапы">
<meta property="og:description" content="Актуальные IT-новости. Технологии, стартапы, разработка и AI — всё в одном месте.">
<meta property="og:url" content="https://vexiostudio.ru/news/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Vexio Studio">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Vexio News — IT новости">
<meta name="twitter:description" content="Свежие IT-новости: технологии, стартапы, AI, разработка.">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Vexio News",
  "url": "https://vexiostudio.ru/news/",
  "description": "IT-новости от Vexio Studio. Технологии, стартапы, AI и разработка.",
  "publisher": { "@id": "https://vexiostudio.ru/#organization" }
}
</script>
<link rel="icon" href="/static/pwalogo.svg" type="image/svg+xml">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        manrope: ['Manrope', 'sans-serif'],
        caveat: ['Caveat', 'cursive'],
      }
    }
  }
}
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Manrope:wght@400;500;700;800&display=swap');
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:#070707}
::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#ccff00}
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect} = React;

function Icon({name,size=20}){
  const p=`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">`;
  const icons={flame:'<path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 11-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 2.5z"/></svg>',arrowRight:'<path d="M5 12h14M12 5l7 7-7 7"/></svg>',arrowUpRight:'<path d="M7 17L17 7M7 7h10v10"/></svg>',zap:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',menu:'<line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>'};
  return <span dangerouslySetInnerHTML={{__html:p+(icons[name]||'')}}/>;
}

function App(){
  const [scrolled,setScrolled]=useState(false);
  const [articles,setArticles]=useState([]);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    const h=()=>setScrolled(window.scrollY>20);
    window.addEventListener('scroll',h);
    const HN='https://hacker-news.firebaseio.com/v0';
    fetch(HN+'/topstories.json')
      .then(r=>r.json())
      .then(ids=>{
        const top=ids.slice(0,12);
        return Promise.all(top.map(id=>fetch(HN+'/item/'+id+'.json').then(r=>r.json())));
      })
      .then(items=>{
        const filtered=items.filter(i=>i&&i.url&&!i.url.startsWith('item?'));
        setArticles(filtered);
        setLoading(false);
      })
      .catch(()=>setLoading(false));
    return ()=>window.removeEventListener('scroll',h);
  },[]);

  const top=articles[0];
  const rest=articles.slice(1,5);
  const extra=articles.slice(5,8);

  function timeAgo(d){var n=new Date();var s=Math.floor((n-new Date(d*1000))/1000);if(s<60)return'только что';var m=Math.floor(s/60);if(m<60)return m+' мин';var h=Math.floor(m/60);if(h<24)return h+' ч';return Math.floor(h/24)+' дн'}

  return (
    <div className="min-h-screen bg-[#070707] text-[#f4f4f5] font-manrope">
      <header className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 border-b ${scrolled?'bg-[#070707]/80 backdrop-blur-md border-white/10 py-3':'bg-transparent border-transparent py-5'}`}>
        <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
          <a href="/" className="relative inline-flex items-center cursor-pointer group no-underline">
            <span className="text-3xl md:text-4xl font-extrabold tracking-tighter uppercase text-white group-hover:text-gray-200 transition-colors">Vexio</span>
            <span className="absolute -bottom-1 -right-20 md:-right-24 text-lg md:text-xl font-caveat text-[#070707] bg-[#ccff00] px-2 py-0.5 rounded-sm transform -rotate-3 group-hover:rotate-0 transition-transform duration-300">small talk</span>
          </a>
          <nav className="hidden md:flex items-center gap-8 font-medium text-sm text-gray-400">
            <a href="/" className="hover:text-white transition-colors">Главная</a>
            <a href="/hr/" className="hover:text-white transition-colors">HR</a>
            <a href="/brief/" className="hover:text-white transition-colors">Brief</a>
            <a href="/news/" className="text-[#ccff00]">Новости</a>
          </nav>
          <div className="flex items-center gap-4">
            <button className="text-gray-400 hover:text-[#ccff00] transition-colors p-2"><Icon name="search"/></button>
            <button className="hidden md:flex items-center gap-2 bg-white text-black px-5 py-2.5 rounded-full font-bold text-sm hover:bg-[#ccff00] transition-colors">Подписаться <Icon name="zap"/></button>
            <button className="md:hidden text-white p-2"><Icon name="menu"/></button>
          </div>
        </div>
      </header>

      <main className="pt-32 pb-20 px-6 max-w-7xl mx-auto">
        <section className="mb-20">
          <div className="flex items-center gap-3 mb-6">
            <div className="flex items-center justify-center w-8 h-8 rounded-full bg-[#ccff00]/20 text-[#ccff00]"><Icon name="flame" size={18}/></div>
            <span className="font-bold tracking-widest uppercase text-sm text-[#ccff00]">Главное за неделю</span>
          </div>
          
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 items-center">
            <div className="lg:col-span-7">
              <h1 className="text-4xl md:text-6xl font-extrabold leading-[1.1] tracking-tight mb-6">
                {loading?'Загружаем новости...':(top?.title||'Нет новостей')}
              </h1>
              <p className="text-lg text-gray-400 font-medium max-w-2xl mb-8 leading-relaxed">
                {top?.description||'Актуальные IT-новости из мира технологий, стартапов и разработки.'}
              </p>
              {top?.url&&<a href={top.url} target="_blank" className="group inline-flex items-center gap-3 text-lg font-bold no-underline text-white">
                <span className="pb-1 border-b-2 border-white/0 group-hover:border-[#ccff00] transition-all">Читать источник</span>
                <span className="bg-[#1a1a1a] p-2 rounded-full group-hover:bg-[#ccff00] group-hover:text-black transition-colors"><Icon name="arrowRight"/></span>
              </a>}
            </div>
            <div className="lg:col-span-5 relative">
              <div className="aspect-[4/3] rounded-3xl bg-gradient-to-tr from-[#1a1a1a] via-[#2a2a2a] to-[#111] border border-white/5 overflow-hidden relative">
                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 bg-[#ccff00]/20 rounded-full blur-3xl"></div>
                <div className="absolute bottom-6 left-6 flex gap-2">
                  <span className="px-3 py-1 bg-black/50 backdrop-blur-md rounded-full text-xs font-bold uppercase tracking-wider border border-white/10">Тренды</span>
                  <span className="px-3 py-1 bg-black/50 backdrop-blur-md rounded-full text-xs font-bold uppercase tracking-wider border border-white/10">AI</span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section>
          <div className="flex justify-between items-end mb-10 border-b border-white/10 pb-6">
            <h2 className="text-3xl font-extrabold tracking-tight">Свежий поток</h2>
            <a href="/news/" className="hidden md:flex items-center gap-1 text-sm font-bold text-gray-400 hover:text-white no-underline transition-colors">Обновить <Icon name="arrowUpRight" size={16}/></a>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {loading && <div className="col-span-3 text-center py-20 text-gray-500">Загружаем новости...</div>}
            {!loading && !articles.length && <div className="col-span-3 text-center py-20 text-gray-500">Не удалось загрузить. Попробуйте позже.</div>}
            
            {rest.map((a,i)=>(
              <a key={i} href={a.url} target="_blank" className="no-underline group relative flex flex-col justify-between bg-[#111111] border border-white/5 rounded-3xl p-6 hover:border-[#ccff00]/50 hover:-translate-y-1 transition-all duration-300 cursor-pointer">
                <div>
                  <div className="flex justify-between items-start mb-6">
                    <span className="px-3 py-1 bg-[#1a1a1a] text-gray-300 rounded-full text-xs font-bold uppercase tracking-wider">{a.by||'HN'}</span>
                    <span className="text-gray-500 text-sm font-medium">{a.time?timeAgo(a.time):''}</span>
                  </div>
                  <h3 className="text-xl font-bold leading-snug mb-3 group-hover:text-[#ccff00] transition-colors text-white">{a.title}</h3>
                  <p className="text-gray-400 text-sm line-clamp-2">{a.description?.slice(0,150)}</p>
                </div>
                <div className="mt-6 flex items-center gap-2 text-sm font-bold opacity-0 group-hover:opacity-100 transition-all transform translate-x-[-10px] group-hover:translate-x-0 text-[#ccff00]">Читать <Icon name="arrowRight" size={16}/></div>
              </a>
            ))}

            {extra.length>0&&extra[0]&&(
              <a href={extra[0].url} target="_blank" className="no-underline group relative flex flex-col justify-between bg-gradient-to-br from-[#1a1a2e] to-[#0f0f1a] border border-[#2979ff]/30 rounded-3xl p-6 hover:border-[#2979ff] hover:-translate-y-1 transition-all duration-300 cursor-pointer">
                <div className="absolute top-0 right-0 w-32 h-32 bg-[#2979ff]/20 rounded-full blur-3xl"></div>
                <div className="relative z-10">
                  <div className="flex justify-between items-start mb-6">
                    <span className="px-3 py-1 bg-[#2979ff]/20 text-[#82b1ff] rounded-full text-xs font-bold uppercase tracking-wider border border-[#2979ff]/30">{extra[0].by||'HN'}</span>
                    <span className="text-[#82b1ff]/70 text-sm font-medium">{extra[0].time?timeAgo(extra[0].time):''}</span>
                  </div>
                  <h3 className="text-xl font-bold leading-snug mb-3 text-white">{extra[0].title}</h3>
                  <p className="text-gray-300 text-sm line-clamp-2">{extra[0].description?.slice(0,150)}</p>
                </div>
                <div className="relative z-10 mt-6 flex items-center gap-2 text-sm font-bold text-[#82b1ff]">Аналитика <Icon name="arrowUpRight" size={16}/></div>
              </a>
            )}
          </div>
        </section>
      </main>

      <footer className="bg-[#050505] border-t border-white/5 pt-16 pb-8 px-6 mt-10">
        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start gap-10 md:gap-0">
          <div>
            <div className="relative inline-flex items-center mb-6">
              <span className="text-3xl font-extrabold tracking-tighter uppercase text-white">Vexio</span>
              <span className="absolute -bottom-1 -right-16 text-sm font-caveat text-black bg-white px-2 py-0.5 rounded-sm transform -rotate-3">small talk</span>
            </div>
            <p className="text-gray-500 text-sm max-w-xs font-medium">Независимое издание о технологиях, бизнесе и людях, которые их создают.</p>
          </div>
          <div className="flex gap-16">
            <div className="flex flex-col gap-3">
              <h4 className="text-white font-bold mb-2">Разделы</h4>
              <a href="/" className="text-gray-400 hover:text-[#ccff00] text-sm no-underline transition-colors">Главная</a>
              <a href="/hr/" className="text-gray-400 hover:text-[#ccff00] text-sm no-underline transition-colors">HR</a>
              <a href="/brief/" className="text-gray-400 hover:text-[#ccff00] text-sm no-underline transition-colors">Brief</a>
            </div>
            <div className="flex flex-col gap-3">
              <h4 className="text-white font-bold mb-2">Проект</h4>
              <a href="https://t.me/vexiostudiocahnnel" className="text-gray-400 hover:text-[#ccff00] text-sm no-underline transition-colors">Telegram</a>
              <a href="/" className="text-gray-400 hover:text-[#ccff00] text-sm no-underline transition-colors">Vexio Studio</a>
            </div>
          </div>
        </div>
        <div className="max-w-7xl mx-auto mt-16 pt-8 border-t border-white/5 flex flex-col md:flex-row justify-between items-center gap-4 text-xs font-bold text-gray-600">
          <p>© 2026 Vexio. Новости через NewsAPI.org</p>
          <div className="flex gap-6">
            <a href="https://t.me/vexiostudiocahnnel" className="no-underline hover:text-white transition-colors">Telegram</a>
          </div>
        </div>
      </footer>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
