function usePerPage() {
  const [pp, setPp] = useState(() => {
    const w = window.innerWidth;
    return w < 640 ? 1 : w < 1024 ? 2 : 4;
  });
  useEffect(() => {
    const fn = () => {
      const w = window.innerWidth;
      setPp(w < 640 ? 1 : w < 1024 ? 2 : 4);
    };
    window.addEventListener("resize", fn);
    return () => window.removeEventListener("resize", fn);
  }, []);
  return pp;
}

  const [isComplete, setIsComplete] = useState(false);
  const [langSet, setLangSet] = useState(false);
  const [activeSteps, setActiveSteps] = useState(STEPS_LANG);
  const stepRef = useRef(0);
  const answersRef = useRef({});
  const doneRef = useRef(false);
  const inputRef = useRef(null);
  const scrollRef = useRef(null);
  useEffect(() => { if (current && current.type !== "lang" && current.type !== "yesno") inputRef.current?.focus(); }, [step, current]);
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [history]);
  const handleSubmit = () => {
    if (doneRef.current) return;
    const s = stepRef.current;
    if (!input.trim() && s < activeSteps.length) return;
    const currentStep = activeSteps[s];
    const val = input.trim();
    const newAnswers = { ...answersRef.current, [currentStep.key]: val };
    answersRef.current = newAnswers;
    setHistory(h => [...h, { type: "prompt", text: currentStep.prompt }, { type: "answer", text: val || "—" }]);
    setInput("");

      const steps = getSteps(val);
      activeSteps.length = 1;
      activeSteps.push(...steps);
      setActiveSteps([...activeSteps]);
      setLangSet(true);
    }
    if (s < activeSteps.length - 1) {
      const ns = s + 1;
      stepRef.current = ns;
      setStep(ns);
    } else {
      doneRef.current = true;
      setHistory(h => [...h, { type: "system", text: t("doneMsg") }]);
